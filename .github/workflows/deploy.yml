# Build the site with Astro and publish dist/ to GitHub Pages.
#
# site/ — the frozen Framer output — is still in the repo but is no longer what
# ships. It stays until the rebuild has run cleanly for a while, because it is
# the reference the fidelity harness measures against.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# اگر چند push پشت سر هم بیاید، دیپلوی در حال اجرا را نصفه نمی‌کنیم.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci, not npm install: the lockfile decides, so a build here matches a
      # build on the laptop and neither drifts on its own.
      - run: npm ci

      # The content gate, before the build rather than after it. It needs no
      # browser, so it costs seconds and it fails the deploy rather than
      # shipping a page with the wrong words on it.
      #
      # The style and layout gate is not here: it measures a real browser
      # against the Framer mirror on a second port, which CI cannot do without
      # a Playwright runner. It is the pre-merge step in tools/verify/README.md
      # and it is the one that matters — the first rebuild shipped a collapsed
      # hero, no entrance animations and a stretched carousel while every
      # automated check passed.
      - run: npm run verify

      - run: npm run build

      - uses: actions/configure-pages@v5

      # public/CNAME is copied into dist/ by the build, so the custom domain
      # survives every deploy and DNS and the certificate are untouched.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
