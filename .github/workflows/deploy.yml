# Build the site with Astro and publish dist/ to GitHub Pages.
#
# site/ — the frozen Framer output — is still in the repo but is no longer what
# ships. It stays until the rebuild has run cleanly for a while, because it is
# the reference the fidelity harness measures against.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# اگر چند push پشت سر هم بیاید، دیپلوی در حال اجرا را نصفه نمی‌کنیم.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # ROLLED BACK to the Framer output. The Astro rebuild matches on type and
      # text but not on interaction — smooth scroll was never built and the
      # carousel behaves differently — so it is not what should be serving a
      # portfolio. It stays in the repo and ships again once it feels the same.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
